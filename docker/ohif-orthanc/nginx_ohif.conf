server {
  listen 80;
  client_max_body_size 5G;
  client_body_timeout 600s;
  send_timeout 600s;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # Orthanc (PACS) proxy for OHIF DICOMweb calls
  location /orthanc/ {
    proxy_pass http://pacs:8042;
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Basic YWRtaW46T2N0ZWxlcmFkLnBhY3M=";
    rewrite /orthanc(.*) $1 break;
  }

  # Study API proxy so viewer/frontends on :3000 can call /api without CORS friction
  location /api/ {
    proxy_pass http://192.168.4.249:3001/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # External PACS passthrough for embedded/native viewer handoff.
  # Swap the upstream to http://macexpansion.octelerad.pserv/ if DNS is preferred.
  location ^~ /external-pacs/ {
    proxy_pass http://192.168.4.150/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
    client_max_body_size 1G;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
