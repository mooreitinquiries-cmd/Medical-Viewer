name: MapDR API Upload Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mapdr-api/**"
      - "frontend/mediview-portal/**"
      - ".github/workflows/mapdr-api-upload-integration.yml"
  push:
    branches:
      - main
    paths:
      - "mapdr-api/**"
      - "frontend/mediview-portal/**"
      - ".github/workflows/mapdr-api-upload-integration.yml"

jobs:
  upload-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mapdr-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mapdr-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start API server
        run: |
          PORT=3001 NODE_ENV=test nohup node server.js >/tmp/mapdr-api-ci.log 2>&1 &
          echo $! >/tmp/mapdr-api-ci.pid

      - name: Wait for API readiness
        run: |
          for i in {1..40}; do
            if curl -fsS \
              -H 'x-user-email: doctor@example.com' \
              -H 'x-user-role: doctor' \
              http://127.0.0.1:3001/api/studies >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          tail -n 120 /tmp/mapdr-api-ci.log || true
          exit 1

      - name: Run upload integration suite
        run: npm run test:integration:upload:curl

      - name: Upload API failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mapdr-api-failure-artifacts
          path: |
            /tmp/mapdr-api-ci.log
            mapdr-api/studies.json
            mapdr-api/case-recordings.json
          if-no-files-found: ignore

      - name: Stop API server
        if: always()
        run: |
          if [[ -f /tmp/mapdr-api-ci.pid ]]; then
            kill "$(cat /tmp/mapdr-api-ci.pid)" || true
          fi

  frontend-upload-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend/mediview-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/mediview-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run targeted upload tests (PR fast path)
        if: github.event_name == 'pull_request'
        run: npx vitest run src/test/api.test.ts src/test/uploadStudy.test.tsx

      - name: Run full frontend test suite (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test

      - name: Upload frontend failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mediview-portal-failure-artifacts
          path: |
            frontend/mediview-portal/src/test
          if-no-files-found: ignore
